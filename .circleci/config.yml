# uYouEnhanced macOS IPA delivery pipeline.
# Default OFF: pushing commits does not start an expensive macOS build.
# The source IPA URL belongs in CircleCI Project Settings > Environment Variables
# as YOUTUBE_IPA_URL, never in pipeline parameters, git, or job logs.
version: 2.1

parameters:
  run_ipa_url_check:
    type: boolean
    default: false
  run_ipa_preflight:
    type: boolean
    default: false
  run_ipa_build:
    type: boolean
    default: false
  build_ffmpeg:
    type: boolean
    default: false
  modern_ytuhd:
    type: boolean
    default: true

jobs:
  # Low-credit Linux validation. Does not download or build the IPA.
  ipa-recipe-preflight:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate CircleCI IPA source and disabled-by-default gate
          command: |
            bash -n Scripts/build_circleci_ipa.sh
            bash -n Scripts/preflight_circleci_injector.sh
            bash -n Scripts/ci_macho_injector.sh
            bash -n Scripts/install_circleci_macos_deps.sh
            bash -n Scripts/build_circleci_ytuhd_deps.sh
            bash -n Scripts/preflight_circleci_patch_chain.sh
            python3 -m compileall -q Scripts/check_circleci_patched_sources.py Scripts/prepare_circleci_ytuhd.py Scripts/macho_lief_inject.py
            python3 -m unittest discover -s tests -p "test_circleci_ipa*.py" -v
            # Rehearse all source edits with actual pinned submodules.
            # No private host IPA, Xcode, or macOS credits used here.
            bash Scripts/preflight_circleci_patch_chain.sh

  # Low-credit, secret-safe check of the *actual* CircleCI project URL.
  # Does not print the source URL, download it, or allocate a macOS runner.
  ipa-url-check:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate the current project IPA URL without exposing the token
          command: |
            set +x
            python3 Scripts/normalize_circleci_ipa_url.py >/dev/null

  build-youtube-ipa:
    macos:
      xcode: "26.5"
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Validate source branch and available Xcode
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = pip-lab-v12
            xcodebuild -version
            bash -n Scripts/build_circleci_ipa.sh
            test -f Scripts/check_circleci_headers.py
            test -f Scripts/build_circleci_ipa.sh
            test -f Scripts/verify_ipa.py
      - run:
          name: Prepare verified unsigned SideStore IPA
          no_output_timeout: 30m
          command: |
            export RUN_IPA_BUILD=true
            export BUILD_FFMPEG="<< pipeline.parameters.build_ffmpeg >>"
            export MODERN_YTUHD="<< pipeline.parameters.modern_ytuhd >>"
            bash Scripts/build_circleci_ipa.sh
      - store_artifacts:
          path: build-artifacts
          destination: youtube-ipa

workflows:
  test-ipa-url:
    when: << pipeline.parameters.run_ipa_url_check >>
    jobs:
      - ipa-url-check:
          filters:
            branches:
              only:
                - pip-lab-v12

  test-ipa-preflight:
    when: << pipeline.parameters.run_ipa_preflight >>
    jobs:
      - ipa-recipe-preflight:
          filters:
            branches:
              only:
                - pip-lab-v12

  manual-youtube-ipa:
    when: << pipeline.parameters.run_ipa_build >>
    jobs:
      # The macOS VM is NOT allocated until the user approves in CircleCI.
      - approve-youtube-ipa:
          type: approval
          filters:
            branches:
              only:
                - pip-lab-v12
      - build-youtube-ipa:
          requires:
            - approve-youtube-ipa
          filters:
            branches:
              only:
                - pip-lab-v12
