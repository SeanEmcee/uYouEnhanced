# Isolated Nyxian Crimson branch. All workflows are disabled by default.
# macOS credits only begin after the owner approves in CircleCI.
version: 2.1
parameters:
  run_crimson_preflight:
    type: boolean
    default: false
  run_crimson_build:
    type: boolean
    default: false
jobs:
  crimson-preflight:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate safe Nyxian Crimson build recipe
          command: |
            set -euo pipefail
            bash -n scripts/build_nyxian_crimson.sh
            python3 -m compileall -q scripts/apply_crimson_assets.py scripts/unpack_assets.py scripts/verify_unsigned_ipa.py
            python3 -m unittest discover -s tests -p "test_crimson_assets.py" -v
  build-crimson-nyxian:
    macos:
      xcode: "26.5"
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Build Nyxian source with compiled Crimson icons
          no_output_timeout: 40m
          command: |
            export RUN_CRIMSON_BUILD=true
            bash scripts/build_nyxian_crimson.sh
      - store_artifacts:
          path: build-artifacts
          destination: nyxian-crimson
workflows:
  crimson-linux-preflight:
    when: << pipeline.parameters.run_crimson_preflight >>
    jobs:
      - crimson-preflight:
          filters:
            branches:
              only:
                - nyxian-crimson-circleci
  crimson-manual-build:
    when: << pipeline.parameters.run_crimson_build >>
    jobs:
      - approve-crimson-build:
          type: approval
          filters:
            branches:
              only:
                - nyxian-crimson-circleci
      - build-crimson-nyxian:
          requires:
            - approve-crimson-build
          filters:
            branches:
              only:
                - nyxian-crimson-circleci
